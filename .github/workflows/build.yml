# SPDX-License-Identifier: GPL-2.0
# GitHub Actions workflow for building the manaus kernel with Neutron Clang 23 (LLVM)
name: Build Kernel (Neutron Clang 23)

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build manaus kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            python3 python3-pip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            make cpio lz4 zstd

      - name: Download Neutron Clang 23
        run: |
          sudo mkdir -p /opt/neutron-clang
          sudo chown "$USER" /opt/neutron-clang
          # Download the latest Neutron Clang release
          CLANG_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/02032024/neutron-clang-02032024.tar.zst"
          curl -fsSL -o /tmp/neutron-clang.tar.zst "$CLANG_URL" || \
          wget -q -O /tmp/neutron-clang.tar.zst "$CLANG_URL"
          tar --use-compress-program=zstd -xf /tmp/neutron-clang.tar.zst -C /opt/neutron-clang
          rm /tmp/neutron-clang.tar.zst
          echo "Clang version:"
          /opt/neutron-clang/bin/clang --version

      - name: Set up build environment
        run: |
          echo "/opt/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Configure kernel (manaus_defconfig)
        run: |
          export PATH="/opt/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            manaus_defconfig

      - name: Build kernel
        run: |
          export PATH="/opt/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-manaus
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7
