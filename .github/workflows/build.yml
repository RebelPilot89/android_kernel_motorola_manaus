# SPDX-License-Identifier: GPL-2.0
# GitHub Actions workflow for building the manaus kernel with Neutron Clang 23 (LLVM)
name: Build Kernel (Neutron Clang 23)

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build manaus kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            python3 python3-pip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            make cpio lz4 zstd \
            device-tree-compiler

      - name: Validate DTS (manaus overlays - 0 warnings/errors)
        run: |
          DTS_DIR=arch/arm64/boot/dts/mediatek
          # Match the kernel build system's DTC flags (scripts/Makefile.lib):
          #   -Wno-interrupt_provider, -Wno-unit_address_vs_reg
          # The -Wno-unit_address_vs_reg suppression is intentional: it matches
          # what the kernel itself does because pin-controller state nodes and
          # media-graph port/endpoint nodes conventionally use @N as a
          # disambiguator without a corresponding reg property.
          DTC_EXTRA="-Wno-interrupt_provider -Wno-unit_address_vs_reg"
          PASS=0; FAIL=0
          for dts in \
            mt6879-manaus-docomo-evt1-overlay.dts \
            mt6879-manaus-evb-overlay.dts \
            mt6879-manaus-dvt1-overlay.dts \
            mt6879-manaus-dvt1a-overlay.dts \
            mt6879-manaus-dvt2-overlay.dts; do
            pp=$(mktemp /tmp/dts_XXXXXX.pp)
            dtb=$(mktemp /tmp/dts_XXXXXX.dtb)
            cpp -nostdinc \
              -Iinclude \
              -Iarch/arm64/boot/dts \
              -I"$DTS_DIR" \
              -undef -x assembler-with-cpp \
              "$DTS_DIR/$dts" -o "$pp" 2>&1
            # Capture only stderr (where dtc writes warnings/errors) to
            # avoid false positives from any stdout noise.
            OUT=$(dtc -@ $DTC_EXTRA \
                       -I dts -O dtb -o "$dtb" "$pp" 2>&1 >/dev/null)
            rm -f "$pp" "$dtb"
            # Use case-insensitive match to catch both 'Warning' and 'warning:',
            # 'Error' and 'error:', etc.
            if echo "$OUT" | grep -qiE "warning|error"; then
              echo "FAIL: $dts"
              echo "$OUT" | grep -iE "warning|error"
              FAIL=$((FAIL+1))
            else
              echo "OK:   $dts"
              PASS=$((PASS+1))
            fi
          done
          echo "Passed: $PASS  Failed: $FAIL"
          [ "$FAIL" -eq 0 ]

      - name: Download Neutron Clang (latest via AntMan)
        run: |
          sudo mkdir -p /opt/neutron-clang
          sudo chown "$USER" /opt/neutron-clang
          # Use AntMan to download the latest Neutron Clang build dynamically.
          # AntMan reads latest.txt from the catalogue so the tag is always current.
          cd /opt/neutron-clang
          curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S=latest  # -S=latest: download from catalogue/latest.txt (dynamic)
          echo "Clang version:"
          /opt/neutron-clang/bin/clang --version

      - name: Set up build environment
        run: |
          echo "/opt/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Configure kernel (manaus_defconfig)
        run: |
          export PATH="/opt/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            manaus_defconfig

      - name: Build kernel
        run: |
          export PATH="/opt/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-manaus
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7
